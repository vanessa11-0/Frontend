<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de API</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="img/png" href= "./imagen/Poké_Ball_icon.svg.png">
</head>
<body>

    <header>
        <h1>Explorador Pokémon</h1>
    </header>

    <main class="container">
        <section class="controls">
            <div class="limit-selector">
                <label for="itemsLimit">Mostrar:</label>
                <select id="itemsLimit" onchange="changeLimit(this.value)">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select>
            </div>

            <nav class="pagination">
                <button onclick="navigate('first')" title="Primera página">« Primero</button>
                <button onclick="navigate('prev')" title="Anterior">Anterior</button>
                
                <span id="pageIndicator" class="page-info">Cargando...</span>
                
                <button onclick="navigate('next')" title="Siguiente">Siguiente</button>
                <button onclick="navigate('last')" title="Última página">Último »</button>
            </nav>
        </section>

        <div id="loading" class="loader" style="display: none;">
            <div class="spinner"></div>
            <p>Buscando...</p>
        </div>

        <div id="pokemonGrid" class="pokemon-grid"></div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
