<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard de Clima</h1>
            <form id="weather-form">
                <input type="text" id="city-input" placeholder="Nombre de la ciudad..." required>
                <button type="submit">Buscar</button>
            </form>
        </header>

        <main id="weather-container">
            <p class="info-msg">Ingresa una ciudad para comenzar.</p>
        </main>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
